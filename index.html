<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AQI Predictor — Air Quality Index</title>
    <meta name="description" content="Predict Air Quality Index from pollutant concentrations using a trained Random Forest model.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css" >
</head>
<body>

<header>
    <div class="header-inner">
        <span class="site-title">AQI Predictor</span>
    </div>
</header>

<main>
    <h1 class="page-heading">Predict Air Quality Index</h1>
    <p class="page-lead">Enter pollutant concentrations measured at a monitoring station. The model returns a predicted AQI value and its category.</p>

    <div class="form-section">
        <div class="section-label">Pollutant Concentrations</div>
        <form id="predictForm">
            <div class="input-grid">
                <div class="field">
                    <label for="pm25">PM2.5 <span class="unit">µg/m³</span></label>
                    <input type="number" id="pm25" name="pm25" step="0.01" placeholder="e.g. 40" required>
                    <!-- <span class="hint" id="hint-pm25"></span> -->
                </div>
                <div class="field">
                    <label for="pm10">PM10 <span class="unit">µg/m³</span></label>
                    <input type="number" id="pm10" name="pm10" step="0.01" placeholder="e.g. 100" required>
                    <!-- <span class="hint" id="hint-pm10"></span> -->
                </div>
                <div class="field">
                    <label for="no2">NO₂ <span class="unit">ppb</span></label>
                    <input type="number" id="no2" name="no2" step="0.01" placeholder="e.g. 40" required>
                    <!-- <span class="hint" id="hint-no2"></span> -->
                </div>
                <div class="field">
                    <label for="so2">SO₂ <span class="unit">ppb</span></label>
                    <input type="number" id="so2" name="so2" step="0.01" placeholder="e.g. 12" required>
                    <!-- <span class="hint" id="hint-so2"></span> -->
                </div>
                <div class="field">
                    <label for="co">CO <span class="unit">mg/m³</span></label>
                    <input type="number" id="co" name="co" step="0.01" placeholder="e.g. 1.2" required>
                    <!-- <span class="hint" id="hint-co"></span> -->
                </div>
                <div class="field">
                    <label for="o3">O₃ <span class="unit">ppb</span></label>
                    <input type="number" id="o3" name="o3" step="0.01" placeholder="e.g. 35" required>
                    <!-- <span class="hint" id="hint-o3"></span> -->
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-predict" id="btnPredict">
                    <span class="spinner"></span>
                    Predict
                </button>
                <button type="button" class="btn-clear" id="btnClear">Clear all</button>
            </div>

            <div class="form-error" id="formError"></div>
        </form>
    </div>

    <div class="result-section" id="resultSection">
        <div class="result-header">
            <div class="section-label">Prediction Result</div>
        </div>

        <div class="result-grid">
            <div class="result-card">
                <div class="result-label">Predicted AQI</div>
                <div class="result-value" id="aqiValue">—</div>
                <div class="result-description" id="aqiDesc"></div>
            </div>
            <div class="result-card">
                <div class="result-label">Category</div>
                <div class="result-category" id="categoryValue">—</div>
                <div class="result-description" id="categoryDesc"></div>
            </div>
        </div>

        <div class="aqi-scale">
            <div class="aqi-scale-label">AQI Scale Position</div>
            <div class="scale-bar">
                <div class="scale-fill" id="scaleFill" style="width: 0%"></div>
                <div class="scale-marker" id="scaleMarker" style="left: 0%"></div>
            </div>
            <div class="scale-ticks">
                <span>0</span>
                <span>50</span>
                <span>100</span>
                <span>150</span>
                <span>200</span>
                <span>300</span>
                <span>500</span>
            </div>
        </div>

        <div class="model-info" id="modelInfo"></div>
    </div>
</main>


<script src="script.js"> </script>

</body>
</html>
